name: test

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"   # weekly: catch job-board API changes

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v

  live-job-boards:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Each public board still answers in the shape the script reads
        shell: bash
        run: |
          set -euo pipefail
          for board in gitlab leverdemo linear boschgroup bunq breezy personio; do
            out=$(python skills/find-leads/scripts/hiring.py "$board" --json)
            test -n "$out" || { echo "no roles parsed for $board"; exit 1; }
            echo "$out" | head -1
          done
